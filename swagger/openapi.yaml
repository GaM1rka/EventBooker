openapi: 3.0.3
info:
  title: EventBooker API
  version: 1.0.0
  description: API для создания мероприятий, бронирования мест и подтверждения броней с дедлайнами.
servers:
  - url: http://localhost:8080
tags:
  - name: Events
    description: Мероприятия и бронирования
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /events:
    get:
      tags:
        - Events
      summary: Получить список мероприятий
      responses:
        "200":
          description: Список мероприятий с агрегированными счетчиками
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDetails"
    post:
      tags:
        - Events
      summary: Создать мероприятие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Мероприятие создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
  /events/{id}:
    get:
      tags:
        - Events
      summary: Получить мероприятие и активные брони
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: Детали мероприятия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "404":
          $ref: "#/components/responses/NotFound"
  /events/{id}/book:
    post:
      tags:
        - Events
      summary: Забронировать место
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookEventRequest"
      responses:
        "201":
          description: Бронь создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Свободных мест нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{id}/confirm:
    post:
      tags:
        - Events
      summary: Подтвердить или оплатить бронь
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBookingRequest"
      responses:
        "200":
          description: Бронь подтверждена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    EventID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Сущность не найдена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CreateEventRequest:
      type: object
      required:
        - title
        - eventDate
        - capacity
      properties:
        title:
          type: string
          example: Go workshop
        eventDate:
          type: string
          description: RFC3339, datetime-local или дата
          example: "2026-06-01T19:00"
        capacity:
          type: integer
          minimum: 1
          example: 20
        bookingTtlMinutes:
          type: integer
          minimum: 1
          description: Срок жизни брони для этого мероприятия
          example: 2
        requiresPayment:
          type: boolean
          default: true
          example: true
    BookEventRequest:
      type: object
      required:
        - userName
        - userEmail
      properties:
        userName:
          type: string
          example: Ivan
        userEmail:
          type: string
          format: email
          example: ivan@example.com
    ConfirmBookingRequest:
      type: object
      required:
        - userEmail
      properties:
        userEmail:
          type: string
          format: email
          example: ivan@example.com
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Go workshop
        eventDate:
          type: string
          format: date-time
        capacity:
          type: integer
          example: 20
        bookingTtl:
          type: integer
          description: Go duration в наносекундах
          example: 120000000000
        requiresPayment:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
    Booking:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        eventId:
          type: integer
          format: int64
          example: 1
        userName:
          type: string
          example: Ivan
        userEmail:
          type: string
          format: email
          example: ivan@example.com
        status:
          type: string
          enum:
            - pending
            - confirmed
            - canceled
          example: pending
        expiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    EventDetails:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/Event"
        freeSeats:
          type: integer
          example: 18
        pendingCount:
          type: integer
          example: 1
        confirmedCount:
          type: integer
          example: 1
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    Error:
      type: object
      properties:
        error:
          type: string
          example: invalid input
